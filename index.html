<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nxt Phase AI — Handtekening</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --cream:#F9F6F1;--surface:#F5F0E8;--black:#090909;
      --stone:#9B9590;--green:#3E9B5D;--border:#E2DDD6;
      --mint:#D9E5D7;--font:'DM Sans',system-ui,sans-serif;
    }
    body{background:var(--cream);font-family:var(--font);color:var(--black);min-height:100vh;display:flex;flex-direction:column}
    .topbar{background:var(--black);padding:12px 40px;display:flex;align-items:center;gap:12px}
    .topbar img{height:28px;width:28px}
    .topbar span{font-size:13px;font-weight:500;color:#fff}
    .page{flex:1;max-width:900px;width:100%;margin:0 auto;padding:40px;display:grid;grid-template-columns:280px 1fr;gap:32px;align-items:start}
    @media(max-width:680px){.page{grid-template-columns:1fr;padding:24px 20px}}
    .left{display:flex;flex-direction:column;gap:14px}
    .card{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden}
    .card-head{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;font-size:10px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--stone)}
    .card-body{padding:16px}
    .field{margin-bottom:12px}.field:last-child{margin-bottom:0}
    label{display:block;font-size:12px;font-weight:500;color:var(--stone);margin-bottom:4px}
    input{width:100%;background:var(--cream);border:1px solid var(--border);border-radius:7px;padding:9px 12px;font-family:var(--font);font-size:14px;color:var(--black);outline:none;transition:border-color .15s,box-shadow .15s}
    input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(62,155,93,.1)}
    .steps{background:var(--mint);border:1px solid #b5d4b8;border-radius:10px;padding:14px 16px}
    .steps-title{font-size:12px;font-weight:600;color:var(--green);margin-bottom:8px}
    .steps ol{padding-left:16px}
    .steps li{font-size:12px;color:#2a6b3f;line-height:2}
    .steps strong{color:var(--black)}
    .right{display:flex;flex-direction:column;gap:14px}
    .preview-card{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden}
    .preview-body{padding:20px}
    .btn-copy{width:100%;padding:15px;border:none;border-radius:8px;background:var(--black);color:#fff;font-family:var(--font);font-size:15px;font-weight:600;cursor:pointer;transition:filter .15s}
    .btn-copy:hover{filter:brightness(1.2)}
    .btn-copy:disabled{opacity:.35;cursor:not-allowed}
    .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--black);color:var(--cream);padding:10px 24px;border-radius:999px;font-size:13px;font-weight:500;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:100}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    footer{text-align:center;padding:14px;font-size:12px;color:var(--stone);border-top:1px solid var(--border)}
  </style>
</head>

function buildSig(n, t, phone, linkedin) {
  let rows = '';
  if (phone) {
    const chars = phone.split('').map(c => `<span style="color:#444444;font-family:Aptos,Arial,sans-serif;font-size:16px;mso-color-alt:#444444;">${c}</span>`).join('');
    rows += `<tr><td style="padding:0;mso-line-height-rule:exactly;line-height:20px;white-space:nowrap;">${chars}</td></tr>`;
  }
  if (linkedin) {
    const li = linkedin.replace(/^https?:\/\//, '');
    rows += `<tr><td style="padding:0;mso-line-height-rule:exactly;font-family:Aptos,Arial,sans-serif;font-size:16px;line-height:20px;"><font color="#3E9B5D">${li}</font></td></tr>`;
  }
  return `<table cellpadding="0" cellspacing="0" border="0" style="background:#ffffff;border:0;border-collapse:collapse;border-spacing:0;mso-table-lspace:0pt;mso-table-rspace:0pt;">
  <tr>
    <td style="padding-right:14px;vertical-align:middle;">
      <img src="${LOGO}" width="56" height="56" style="display:block;width:56px;height:56px;" alt="nxt phase ai"/>
    </td>
    <td style="width:1px;background:#dddddd;font-size:1px;line-height:1px;">&nbsp;</td>
    <td style="padding-left:14px;vertical-align:middle;">
      <table cellpadding="0" cellspacing="0" border="0" style="border:0;border-collapse:collapse;border-spacing:0;mso-table-lspace:0pt;mso-table-rspace:0pt;">
        <tr><td style="padding:0;mso-line-height-rule:exactly;font-family:Aptos,Arial,sans-serif;font-size:16px;font-weight:bold;color:#090909;line-height:20px;white-space:nowrap;">${n}</td></tr>
        <tr><td style="padding:0 0 6px 0;mso-line-height-rule:exactly;font-family:Aptos,Arial,sans-serif;font-size:16px;line-height:20px;white-space:nowrap;"><font color="#3E9B5D">${t}</font></td></tr>
        ${rows}
        <tr><td style="padding:5px 0 0 0;mso-line-height-rule:exactly;font-family:Aptos,Arial,sans-serif;font-size:16px;line-height:20px;"><a href="https://nxtphase.ai" style="color:#3E9B5D;text-decoration:none;font-weight:bold;" target="_blank"><font color="#3E9B5D"><b>nxtphase.ai</b></font></a></td></tr>
      </table>
    </td>
  </tr>
</table>`;
}

function vals() {
  return {
    name:     document.getElementById('inp-name').value.trim(),
    title:    document.getElementById('inp-title').value.trim(),
    phone:    document.getElementById('inp-phone').value.trim(),
    linkedin: document.getElementById('inp-linkedin').value.trim(),
  };
}

function update() {
  const v = vals();
  const ok = v.name.length > 0;
  document.getElementById('copy-btn').disabled = !ok;
  document.getElementById('sig-preview').innerHTML = ok
    ? buildSig(v.name, v.title, v.phone, v.linkedin)
    : '<span style="color:#bbb;font-size:13px">Vul je naam in…</span>';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function copyHTML() {
  const v = vals();
  const sig = buildSig(v.name, v.title, v.phone, v.linkedin);
  // Wrap in full HTML doc so Outlook parses it correctly
  const full = `<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body>${sig}</body></html>`;
  const blob = new Blob([full], {type:'text/html'});
  navigator.clipboard.write([new ClipboardItem({'text/html': blob})])
    .then(() => showToast('✓ Gekopieerd — plak met Ctrl+Shift+V in Outlook handtekeningen'))
    .catch(() => navigator.clipboard.writeText(sig).then(() => showToast('✓ Gekopieerd')));
}
</script>
</body>
</html>
